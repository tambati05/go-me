name: Data analyst pipeline tests
on:
  push:
    paths:
      - 'data-analyst-pipeline/**'
      - '.github/workflows/data-analyst-pipeline-tests.yml'
  pull_request:
    paths:
      - 'data-analyst-pipeline/**'
      - '.github/workflows/data-analyst-pipeline-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: data-analyst-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run demo pipeline
        run: python -m analytics_pipeline
